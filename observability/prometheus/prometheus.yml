# Targets are the local ends of the SSH tunnel (scripts/obs-tunnel.sh):
# 9102 is the API /metrics, 9101 the runner. host.docker.internal is the
# Windows host as seen from the container.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["host.docker.internal:9102"]
  - job_name: runner
    static_configs:
      - targets: ["host.docker.internal:9101"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
