# Build the API image, scan it, push it to GHCR (private package), then roll it out to the
# k3s control host through SSM Run Command. No SSH, no long-lived AWS keys: GitHub OIDC
# assumes the role created in infra/aws/ci.tf, which trusts only the `production` environment.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/karthiksp1911/leetforce-api

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -f api/Dockerfile -t "$IMAGE:$GITHUB_SHA" .

      # Scan before anything leaves the runner; a fixable HIGH or CRITICAL finding stops the job.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/karthiksp1911/leetforce-api:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image holds the hidden test data (problems/), so the package must stay private.
      - name: Push image
        run: docker push "$IMAGE:$GITHUB_SHA"

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Assume deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy through SSM Run Command
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          instance_id="$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=leetforce-control" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          if [ -z "$instance_id" ] || [ "$(wc -w <<<"$instance_id")" -ne 1 ]; then
            echo "expected exactly one running leetforce-control instance, got: '$instance_id'" >&2
            exit 1
          fi

          # Fetch the commit first so the script that runs is the one for this SHA.
          remote_cmd="set -e; [ -d /opt/leetforce/.git ] || git clone --depth 1 https://github.com/KarthikSP1911/Leetforce.git /opt/leetforce; git -C /opt/leetforce fetch --depth 1 origin $SHA; git -C /opt/leetforce checkout -qf $SHA; bash /opt/leetforce/scripts/k3s/deploy.sh $SHA"
          params="$(jq -cn --arg c "$remote_cmd" '{commands: [$c]}')"

          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$instance_id" \
            --comment "leetforce deploy ${SHA:0:12}" \
            --timeout-seconds 600 \
            --parameters "$params" \
            --query Command.CommandId --output text)"
          echo "command $command_id on $instance_id"

          # `wait` exits non-zero on Failed/TimedOut; the final status is read explicitly below.
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance_id" || true
          status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" \
            --query Status --output text)"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" \
            --query StandardErrorContent --output text >&2
          echo "status: $status"
          [ "$status" = "Success" ]
