# Local services for development. Redis in the cloud is Upstash (LEETFORCE_REDIS_URL);
# this Redis is for offline work and tests. Bound to localhost only.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${LEETFORCE_MINIO_USER:-leetforce}
      MINIO_ROOT_PASSWORD: ${LEETFORCE_MINIO_PASSWORD:?set LEETFORCE_MINIO_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

volumes:
  redis-data:
  minio-data:
