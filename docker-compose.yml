# Local services for development. Redis in the cloud is Upstash (LEETFORCE_REDIS_URL);
# this Redis is for offline work and tests. Bound to localhost only.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  # S3-compatible object store for problem test data (ADR 0011). MinIO stopped
  # publishing container images in 2025, so local development uses RustFS; the
  # code only speaks the S3 API, and the cloud uses real S3.
  s3:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${LEETFORCE_S3_ACCESS_KEY:?set LEETFORCE_S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${LEETFORCE_S3_SECRET_KEY:?set LEETFORCE_S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - s3-data:/data

volumes:
  redis-data:
  s3-data:
