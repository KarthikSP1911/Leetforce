<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 722" width="1200" height="722" role="img" aria-labelledby="t d">
<title id="t">LeetForce high level architecture</title>
<desc id="d">A user reaches the web and API tier over HTTP. The API calls a problem service backed by Postgres, a submission service that stores submissions in Postgres and queues jobs in Redis Streams for a runner that judges code in a sandbox and reports the verdict back, a contest service backed by Postgres, and a leaderboard service backed by a Redis cache. Runners read test bundles from S3. Prometheus, Grafana and Loki observe the API and the runner. AWS IAM roles scope access to S3 and secrets.</desc>
