apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: leetforce
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: leetforce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: leetforce
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/karthiksp1911/leetforce-api:latest
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9102
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-env
          # healthz does no I/O (process is up); readyz needs Redis, Postgres and S3.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          # The API publishes every problem bundle to S3 before it listens.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 36
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
