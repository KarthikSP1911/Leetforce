# k3s ships Traefik, which listens on the node's port 80. The security group restricts
# who can reach it (owner and runner hosts). Add a host and TLS here when the API gets a
# public name (Vercel web, ADR 0021 follow-up).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: leetforce
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
