apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: leetforce
resources:
  - namespace.yaml
  - api-configmap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-ingress.yaml
# CI sets the image tag to the commit (kustomize edit set image); latest is only a default.
images:
  - name: ghcr.io/karthiksp1911/leetforce-api
    newTag: latest
