apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "leetforce-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "leetforce-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "leetforce-api.labels" . | nindent 8 }}
      annotations:
        # A config change rolls the pods (env from a ConfigMap is only read at start).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: {{ .Values.pullSecretName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.ports.http }}
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: {{ .Values.envSecretName }}
          # healthz does no I/O (process is up); readyz needs Redis, Postgres and S3.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          # The API publishes every problem bundle to S3 before it listens.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 36
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
