{{- if .Values.ingress.enabled }}
# k3s ships Traefik, which listens on the node's port 80. The security group restricts
# who can reach it (owner and runner hosts).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  labels:
    {{- include "leetforce-api.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - secretName: {{ .Values.ingress.tlsSecretName }}
      {{- if .Values.ingress.host }}
      hosts: [{{ .Values.ingress.host | quote }}]
      {{- end }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
{{- end }}
